name: Sync Content from excursion-studio.github.io

on:
  repository_dispatch:
    types: [content-updated]

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout .github repo
        uses: actions/checkout@v4
        with:
          path: github-repo
      
      - name: Checkout excursion-studio.github.io repo
        uses: actions/checkout@v4
        with:
          repository: Excursion-Studio/excursion-studio.github.io
          path: source-repo
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          pip install -r github-repo/scripts/requirements.txt
      
      - name: Run sync script
        run: |
          python github-repo/scripts/sync_content.py \
            --source source-repo \
            --target github-repo
      
      - name: Commit and push changes
        working-directory: github-repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          git add -A
          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          
          git commit -m "Sync content from excursion-studio.github.io
          
          Triggered by: ${{ github.event.client_payload.source_repo }}
          Commit SHA: ${{ github.event.client_payload.commit_sha }}"
          
          git push
